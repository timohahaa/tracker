<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracker</title>
    <script>
      // Anti-FOUC: apply the theme class before React hydrates. Keep the storage
      // key ("ui-theme") and default (dark) in sync with ThemeProvider.
      ;(function () {
        try {
          var stored = localStorage.getItem('ui-theme')
          var prefersDark =
            !window.matchMedia ||
            window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark
          if (stored === 'dark') isDark = true
          else if (stored === 'light') isDark = false
          else if (stored === 'system') isDark = prefersDark
          else isDark = true // no stored preference -> default to dark
          document.documentElement.classList.toggle('dark', isDark)
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
